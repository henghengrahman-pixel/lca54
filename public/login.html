<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - LiveChat Monitor</title><link rel="stylesheet" href="/app.css?v=1.0.5"></head><body>
<div class="center"><form class="card login" method="post" action="/login" autocomplete="on"><h1>LiveChat Monitor</h1><p>Masuk ke dashboard.</p><label>ID<input name="id" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Masuk</button><div class="err" id="loginErr"></div></form></div>
<script>const q=new URLSearchParams(location.search).get('login');document.getElementById('loginErr').textContent=q==='invalid'?'ID atau password salah.':q==='rate'?'Terlalu banyak percobaan. Coba lagi sebentar.':'';</script>
</body></html>
