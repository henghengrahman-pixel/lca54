<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LiveChat Monitor</title><link rel="stylesheet" href="/app.css?v=1.0.8"></head><body><div id="app"><header><div><b>LiveChat Mischat Monitor</b><small id="who"></small></div><button class="ghost" id="logoutBtn">Keluar</button></header><main><section class="card"><div class="section-title"><h2>Laporan Web</h2><select id="brand"></select><button id="scanBtn">Scan Yesterday</button></div></section><section class="stats"><div class="stat"><span>Status</span><b id="sStatus">-</b></div><div class="stat"><span>Progress</span><b id="sProgress">0/0</b></div><div class="stat"><span>Normal</span><b id="sNormal">0</b></div><div class="stat danger"><span>Mischat</span><b id="sMischat">0</b></div><div class="stat"><span>Error/Recheck</span><b id="sError">0</b></div></section><section class="grid"><div class="card"><h2>Extension / PC</h2><div id="devices"></div></div><div class="card"><h2>Mischat per Agent</h2><div id="agents"></div></div></section><section class="card"><div class="section-title"><h2>Hasil</h2><div class="filters"><input id="dateFilter" type="date"><select id="statusFilter"><option value="MISCHAT">Mischat</option><option value="NORMAL">Normal</option><option value="ERROR">Error/Recheck</option><option value="">Semua</option></select><button class="ghost" id="refreshBtn">Refresh</button></div></div><div class="table-wrap"><table><thead><tr><th>Web</th><th>Waktu</th><th>Agent</th><th>User</th><th>Chat ID</th><th>Pesan terakhir member</th><th>Status</th><th>Bukti</th><th>Telegram</th></tr></thead><tbody id="results"></tbody></table></div></section><section class="card"><h2>Telegram per Web</h2><form id="settingsForm" class="settings"><label>Web<select id="tgBrand"></select></label><label>Bot Token (satu bot pusat)<input id="tgToken" type="password" placeholder="Kosongkan jika tidak diganti"></label><label>Chat ID tujuan web<input id="tgChat"></label><label>Auto Scan WIB<input id="autoTime" type="time"></label><label class="check"><input id="tgEnabled" type="checkbox"> Telegram aktif</label><div><button>Simpan</button> <button type="button" class="ghost" id="testTg">Test</button></div></form></section><section class="card"><h2>Riwayat Scan</h2><div class="table-wrap"><table><thead><tr><th>Web</th><th>Tanggal</th><th>Status</th><th>PC</th><th>Checkpoint Chat ID</th><th>Checkpoint</th><th>Diperiksa</th><th>Mischat</th><th>Error</th></tr></thead><tbody id="scans"></tbody></table></div></section></main></div><script src="/app.js?v=1.0.8"></script></body></html>
